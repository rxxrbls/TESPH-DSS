<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --tesph-brand: #d9980f;
        --tesph-brand-strong: #b77908;
        --tesph-border: #e4ddd2;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #22201d;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 0 2px;
      }

      .picker {
        position: relative;
        width: clamp(132px, 40vw, 148px);
        height: clamp(132px, 40vw, 148px);
      }

      .logo {
        width: clamp(116px, 35vw, 132px);
        height: clamp(116px, 35vw, 132px);
        margin: 0 auto;
        border-radius: 999px;
        border: 1px solid var(--tesph-border);
        background: #ffffff;
        box-shadow: 0 8px 22px rgba(42, 31, 12, 0.08);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 999px;
        padding: 10px;
        box-sizing: border-box;
      }

      .edit {
        position: absolute;
        left: calc(50% + clamp(116px, 35vw, 92px) / 2 - 20px);
        top: calc(clamp(116px, 35vw, 132px) * 0.72);
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: 2px solid #ffffff;
        background: var(--tesph-brand);
        color: #ececec;
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(42, 31, 12, 0.18);
        transition: 120ms ease;
      }

      .edit:hover,
      .edit:focus {
        background: var(--tesph-brand-strong);
        color: #ffffff;
        outline: none;
      }

      .edit svg {
        width: 16px;
        height: 16px;
        pointer-events: none;
      }

      input[type="file"] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="picker">
        <div class="logo">
          <img id="logo" alt="Business logo" />
        </div>
        <button id="edit" class="edit" type="button" aria-label="Change business logo" title="Change business logo">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 7.8h3.1l1.2-2A1.7 1.7 0 0 1 9.8 5h4.4c.6 0 1.2.3 1.5.8l1.2 2H20c1.1 0 2 .9 2 2V18c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V9.8c0-1.1.9-2 2-2Z" fill="currentColor"/>
            <path d="M12 17a3.7 3.7 0 1 0 0-7.4A3.7 3.7 0 0 0 12 17Z" fill="#fff"/>
          </svg>
        </button>
        <input id="file" type="file" accept="image/png,image/jpeg" />
      </div>
    </div>

    <script>
      const Streamlit = {
        setComponentReady() {
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
        },
        setFrameHeight(height) {
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setFrameHeight", height }, "*");
        },
        setComponentValue(value) {
          window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:setComponentValue", value }, "*");
        },
      };

      const logo = document.getElementById("logo");
      const edit = document.getElementById("edit");
      const file = document.getElementById("file");
      let args = {};

      function updateHeight() {
        Streamlit.setFrameHeight(document.body.scrollHeight + 2);
      }

      function render() {
        logo.src = args.currentImage || "";
        logo.alt = `${args.businessName || "Business"} logo`;
        updateHeight();
      }

      edit.addEventListener("click", () => {
        file.click();
      });

      file.addEventListener("change", () => {
        const selected = file.files && file.files[0];
        if (!selected) return;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || "");
          logo.src = dataUrl;
          Streamlit.setComponentValue({
            name: selected.name,
            type: selected.type,
            size: selected.size,
            dataUrl,
          });
          updateHeight();
        };
        reader.readAsDataURL(selected);
      });

      window.addEventListener("message", (event) => {
        if (event.data.type !== "streamlit:render") return;
        args = event.data.args || {};
        render();
      });

      Streamlit.setComponentReady();
      updateHeight();
    </script>
  </body>
</html>
